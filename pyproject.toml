[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-btc-arb"
version = "0.2.0"
description = "Polymarket BTC Up/Down Yes+No ask-sum arbitrage bot (dry-run first)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Comment Compositions" }]
dependencies = [
  "httpx>=0.27",
  "websockets>=12.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
live = [
  "py-clob-client>=0.34.0",
  "web3>=6.0",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
polymarket-btc-arb = "polymarket_btc_arb.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
